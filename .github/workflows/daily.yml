name: Daily Stirling-PDF image

on:
  schedule:
    # Daily rebuild at 05:17 UTC
    - cron: '17 5 * * *'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stirling_version:
        description: 'Override Stirling-PDF release version without leading v (leave empty for latest)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: dgcosenza/stirling-pdf
  ADOPTIUM_GPG_FPR: '3B04D753C9050D9A5D343F39843C48A565F8F04B'

jobs:
  public-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tracked files, attribution, and pull request text
        env:
          PR_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: .github/scripts/public-check.sh

  build-scan-publish:
    needs: public-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve latest official Stirling-PDF release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE_STIRLING: ${{ inputs.stirling_version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve-versions.py
          echo "build_date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "date_iso=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Upload upstream changes artifact
        uses: actions/upload-artifact@v7
        with:
          name: upstream-changes
          path: upstream-changes.md
          retention-days: 90

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build linux/amd64 candidate image (MIT open-source core)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: |
            ${{ env.IMAGE_NAME }}:ci-candidate
          build-args: |
            STIRLING_VERSION=${{ steps.resolve.outputs.stirling_version }}
            ADOPTIUM_GPG_FPR=${{ env.ADOPTIUM_GPG_FPR }}
            IMAGE_CREATED=${{ steps.resolve.outputs.created }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}

      - name: Inspect built base OS and JRE versions
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          DEBIAN_VER="$(docker run --rm --entrypoint cat "${IMAGE_NAME}:ci-candidate" /etc/debian_version | tr -d '\r\n')"
          JAVA_VER="$(docker run --rm --entrypoint java "${IMAGE_NAME}:ci-candidate" -version 2>&1 | head -n 1 | tr -d '\r\n')"
          echo "debian_version=${DEBIAN_VER}" >> "$GITHUB_OUTPUT"
          echo "java_version=${JAVA_VER}" >> "$GITHUB_OUTPUT"
          echo "Built Debian version: ${DEBIAN_VER}"
          echo "Built Java runtime: ${JAVA_VER}"

      - name: Smoke-test container
        shell: bash
        run: ./tests/smoke.sh "${IMAGE_NAME}:ci-candidate"

      - name: Scan image with Trivy — full table report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:ci-candidate'
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          output: 'trivy-report.txt'

      - name: Scan image with Trivy — JSON report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:ci-candidate'
          format: 'json'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          output: 'trivy-report.json'

      - name: Scan image with Trivy — SARIF for code scanning
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:ci-candidate'
          format: 'sarif'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-stirling-pdf

      - name: Upload Trivy reports (90-day retention)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-reports
          path: |
            trivy-report.txt
            trivy-report.json
            trivy-results.sarif
          retention-days: 90
          if-no-files-found: ignore

      - name: Scan image with Trivy — HARD GATE (0 fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE_NAME }}:ci-candidate'
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan image with Grype — HARD GATE (0 fixable CRITICAL/HIGH)
        id: grype
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: anchore/scan-action@v7
        with:
          image: '${{ env.IMAGE_NAME }}:ci-candidate'
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table
          output-file: 'grype-report.txt'

      - name: Upload Grype report (90-day retention)
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: grype-report
          path: 'grype-report.txt'
          retention-days: 90
          if-no-files-found: ignore

      - name: Generate SBOM with Syft
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.IMAGE_NAME }}:ci-candidate'
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'
          upload-artifact: false

      - name: Generate build provenance record
        shell: bash
        env:
          STIRLING_VER: ${{ steps.resolve.outputs.stirling_version }}
          DEBIAN_VER: ${{ steps.inspect.outputs.debian_version }}
          JAVA_VER: ${{ steps.inspect.outputs.java_version }}
          CREATED: ${{ steps.resolve.outputs.created }}
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker inspect --format '{{.Id}}' "${IMAGE_NAME}:ci-candidate")"
          python3 - "${IMAGE_ID}" <<'PY'
          import json, os, sys
          prov = {
              "image": os.environ["IMAGE_NAME"],
              "stirling_version": os.environ["STIRLING_VER"],
              "flavor": "core-mit",
              "debian_version": os.environ["DEBIAN_VER"],
              "java_version": os.environ["JAVA_VER"],
              "image_id": sys.argv[1],
              "source": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}",
              "revision": os.environ["GITHUB_SHA"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "created": os.environ["CREATED"],
          }
          with open("provenance.json", "w", encoding="utf-8") as fh:
              json.dump(prov, fh, indent=2)
          PY

      - name: Upload SBOM and provenance artifacts (90-day retention)
        uses: actions/upload-artifact@v7
        with:
          name: sbom-provenance
          path: |
            sbom.spdx.json
            provenance.json
          retention-days: 90

      - name: Check Docker Hub publish credentials
        id: hub_auth
        shell: bash
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "can_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Docker Hub push (PR event or DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not configured)."
          fi

      - name: Log in to Docker Hub
        if: steps.hub_auth.outputs.can_publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push verified image to Docker Hub
        if: steps.hub_auth.outputs.can_publish == 'true'
        id: push
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.resolve.outputs.stirling_version }}"
          DATE="${{ steps.resolve.outputs.build_date }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          CANDIDATE="${IMAGE_NAME}:ci-candidate"

          TAGS=(
            "${IMAGE_NAME}:latest"
            "${IMAGE_NAME}:${VER}"
            "${IMAGE_NAME}:${VER}-${DATE}"
            "${IMAGE_NAME}:sha-${SHORT_SHA}"
          )
          for tag in "${TAGS[@]}"; do
            docker tag "${CANDIDATE}" "${tag}"
            docker push "${tag}"
          done

          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_NAME}:latest")"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Published digest: ${DIGEST}"

      - name: Write build metadata for docs sync
        shell: bash
        env:
          STIRLING_VER: ${{ steps.resolve.outputs.stirling_version }}
          DEBIAN_VER: ${{ steps.inspect.outputs.debian_version }}
          JAVA_VER: ${{ steps.inspect.outputs.java_version }}
          DATE_ISO: ${{ steps.resolve.outputs.date_iso }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          cves = set()
          fixable_ch = 0
          if os.path.exists("trivy-report.json"):
              data = json.load(open("trivy-report.json", encoding="utf-8"))
              for res in data.get("Results", []):
                  for v in res.get("Vulnerabilities") or []:
                      cves.add(v.get("VulnerabilityID", ""))
                      if v.get("FixedVersion") and v.get("Severity") in ("CRITICAL", "HIGH"):
                          fixable_ch += 1
          meta = {
              "stirling_version": os.environ["STIRLING_VER"],
              "debian_version": os.environ["DEBIAN_VER"],
              "java_version": os.environ["JAVA_VER"],
              "date_iso": os.environ["DATE_ISO"],
              "digest": os.environ.get("DIGEST", "") or "pending-hub-publish",
              "trivy_fixable_critical_high": fixable_ch,
              "grype_fixable_critical_high": 0,
              "cves_seen": sorted(c for c in cves if c),
          }
          with open("meta.json", "w", encoding="utf-8") as fh:
              json.dump(meta, fh, indent=2)
          PY

      - name: Upload build metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-meta
          path: meta.json
          retention-days: 90

  update-docs:
    needs: [public-check, build-scan-publish]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download build metadata artifact
        uses: actions/download-artifact@v8
        with:
          name: build-meta
          path: build-meta

      - name: Update versions.json, README.md, and CHANGELOG.md
        run: python3 .github/scripts/update-docs.py build-meta/meta.json

      - name: Re-run public content check before committing
        run: .github/scripts/public-check.sh

      - name: Commit and push automated documentation updates
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain versions.json README.md CHANGELOG.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add versions.json README.md CHANGELOG.md
            git commit -m "chore(docs): update versions and changelog [skip ci]"
            git push origin HEAD:main
          else
            echo "No documentation changes to commit."
          fi

      - name: Check Docker Hub description sync credentials
        id: hub_desc_auth
        shell: bash
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          DESC="$(tr -d '\r\n' < DOCKERHUB_SHORT_DESCRIPTION)"
          if [ "${#DESC}" -gt 100 ]; then
            echo "ERROR: DOCKERHUB_SHORT_DESCRIPTION exceeds 100 characters (${#DESC})" >&2
            exit 1
          fi
          echo "text=${DESC}" >> "$GITHUB_OUTPUT"
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "can_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Docker Hub overview and short description
        if: steps.hub_desc_auth.outputs.can_sync == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: ${{ steps.hub_desc_auth.outputs.text }}
          readme-filepath: ./README.md

  alert:
    needs: [public-check, build-scan-publish, update-docs]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update, or close ci-failure issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RES_PUBLIC: ${{ needs.public-check.result }}
          RES_BUILD: ${{ needs.build-scan-publish.result }}
          RES_DOCS: ${{ needs.update-docs.result }}
        run: |
          set -euo pipefail
          gh label create ci-failure --repo "$REPO" --color B60205 --description "Automated daily CI failure alert" 2>/dev/null || true
          OPEN_NUM="$(gh issue list --repo "$REPO" --label ci-failure --state open --json number --jq '.[0].number // empty')"

          FAILED_STEPS=()
          [ "$RES_PUBLIC" != "success" ] && FAILED_STEPS+=("public-check ($RES_PUBLIC)")
          [ "$RES_BUILD" != "success" ] && FAILED_STEPS+=("build-scan-publish ($RES_BUILD)")
          if [ "$RES_DOCS" != "success" ] && [ "$RES_DOCS" != "skipped" ]; then
            FAILED_STEPS+=("update-docs ($RES_DOCS)")
          fi

          if [ "${#FAILED_STEPS[@]}" -gt 0 ]; then
            SUMMARY="$(IFS=', '; echo "${FAILED_STEPS[*]}")"
            TITLE="Daily build failed: ${SUMMARY}"
            BODY="Automated daily pipeline failure on \`main\`.

          - **Failing job(s):** ${SUMMARY}
          - **Workflow run:** ${RUN_URL}
          - **Commit:** \`${GITHUB_SHA}\`

          This issue will auto-close on the next green run."
            if [ -n "$OPEN_NUM" ]; then
              gh issue edit "$OPEN_NUM" --repo "$REPO" --title "$TITLE" --body "$BODY"
            else
              gh issue create --repo "$REPO" --label ci-failure --title "$TITLE" --body "$BODY"
            fi
          else
            if [ -n "$OPEN_NUM" ]; then
              gh issue close "$OPEN_NUM" --repo "$REPO" --comment "Resolved: daily build is green again (${RUN_URL})."
            fi
          fi
